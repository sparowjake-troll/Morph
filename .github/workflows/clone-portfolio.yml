name: Clone Portfolio

on:
  push:
    branches: [portfolio-clone]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Morph
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Morph CLI
        run: npm run build:cli

      - name: Clone target site
        run: node dist/cli/index.js clone https://portfolio-mu-self-79.vercel.app/ -o site --skip-audit

      - name: Add deployment config
        run: |
          cat > site/vercel.json <<'EOF'
          {
            "framework": "nextjs"
          }
          EOF

      - name: Commit generated site
        run: |
          git config user.name "portfolio-clone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site
          git diff --cached --quiet && echo "No generated changes" || git commit -m "Generate portfolio clone"
          git push origin portfolio-clone
